[workspace]
resolver = "3"
members = [
    "crates/harness",
    "crates/residue",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "time"] }
zeroize = "=1.9.1"

# The ten-minute audio simulation (ADR-0023) runs libopus and the Media Core engines
# 600 000 times; unoptimised builds make `make harness` several times slower.
[profile.dev.package.remotecam-media-core]
opt-level = 2

[profile.dev.package.opusic-sys]
opt-level = 3
