[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/signaling",
    "crates/media-core",
    "crates/injection",
    "crates/audio-bridge",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
publish = false

[workspace.dependencies]
webrtc = "=0.21.1"
# `webrtc` 0.21 does not re-export several of its own configuration types (the
# media engine, transceiver direction and receiver-report selector). Adding its
# exact core crate keeps a single version in the workspace and avoids vendoring
# type wrappers for a non-production spike.
rtc = "=0.21.1"
async-trait = "=0.1.92"
rustls = "=0.23.46"
rcgen = "=0.14.10"
tokio = "=1.54.1"
tokio-tungstenite = "=0.30.0"
slint = "=1.18.1"
windows = "=0.62.2"
qrcode = "=0.14.1"
sha2 = "=0.11.1"
subtle = "=2.6.1"
rand = "=0.10.3"
tokio-rustls = "=0.26.6"
futures-util = "=0.3.34"
openh264 = "=0.9.9"
criterion = "=0.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
