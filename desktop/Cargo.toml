[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/app",
    "crates/session-core",
    "crates/pairing",
    "crates/scrub",
    "crates/media-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
publish = false

[workspace.dependencies]
slint = "=1.18.1"
windows = "=0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = "=1.54.1"
rustls = "=0.23.46"
tokio-rustls = "=0.26.6"
rcgen = "=0.14.10"
sha2 = "=0.11.1"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
async-trait = "=0.1.92"
rtc = "=0.21.1"
webrtc = "=0.21.1"
openh264 = "=0.9.9"
opus = "=0.4.0"
