[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/app",
    "crates/session-core",
    "crates/pairing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
publish = false

[workspace.dependencies]
slint = "=1.18.1"
windows = "=0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = "=1.54.1"
rustls = "=0.23.46"
tokio-rustls = "=0.26.6"
rcgen = "=0.14.10"
sha2 = "=0.11.1"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
