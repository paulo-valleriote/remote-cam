[package]
name = "remotecam-media-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
remotecam-injection = { path = "../injection" }
rtc.workspace = true
sha2.workspace = true
tokio.workspace = true
webrtc.workspace = true

# The software decoder exists only so the Linux CI can exercise the handoff and
# stall paths. The Windows path always uses the Media Foundation decoder and is
# never allowed to cite the software result for the latency gate.
[target.'cfg(not(windows))'.dependencies]
openh264.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
]

[dev-dependencies]
criterion.workspace = true
