[package]
name = "remotecam-media-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Receive-only Media Core: RTP H.264 to NV12 frames behind the Media Port"

[dependencies]
async-trait.workspace = true
remotecam-protocol = { path = "../protocol" }
remotecam-session-core = { path = "../session-core" }
rtc.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
opus.workspace = true
webrtc.workspace = true

# Linux/CI only: not compiled on Windows, so the software decoder is never
# distributed with the product (ADR-0021).
[target.'cfg(not(windows))'.dependencies]
openh264.workspace = true

# Windows only: the Media Foundation hardware decoder (REC-56). `unsafe` COM
# calls are confined to `mf_decoder` (ADR-0025).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
