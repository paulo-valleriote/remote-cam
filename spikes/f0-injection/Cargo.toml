[package]
name = "remotecam-injection"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
publish = false
description = "Quarantined F0 injection spike crate - NON-PRODUCTION"

# NON-PRODUCTION — quarantined F0 risk-reduction spike (FR-039). Nothing here
# merges into `desktop/` or `mobile/`; see docs/adr/0003-f0-code-quarantine.md.

[lib]
crate-type = ["lib", "cdylib"]

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_Devices_Properties",
]
