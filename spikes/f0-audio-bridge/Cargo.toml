[package]
name = "remotecam-audio-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
publish = false
description = "Quarantined F0 audio-bridge spike crate - NON-PRODUCTION"

# NON-PRODUCTION — quarantined F0 risk-reduction spike (FR-039). Nothing here
# merges into `desktop/` or `mobile/`; see docs/adr/0003-f0-code-quarantine.md.

# The renderer reuses the RTP-pacing algorithm documented in `media-core`; the
# RTP timestamps are produced by `media-core` and passed in at the call site.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
]
