[package]
name = "f0-codec-interop"
version = "0.1.0"
edition = "2024"
description = "F0 codec interoperability spike harness - NON-PRODUCTION"
license = "MIT OR Apache-2.0"

[dependencies]
webrtc = { version = "=0.21.1", features = ["runtime-tokio"] }
rtc = { version = "=0.21.1" }
tokio = { version = "=1.54.1", features = ["full", "rt-multi-thread"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls"] }
rustls = "=0.23.46"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"

[profile.release]
lto = true
opt-level = 3