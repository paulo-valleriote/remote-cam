name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Check Rust formatting
        run: |
          set -euo pipefail
          manifests=(
            desktop/Cargo.toml
            spikes/f0-handshake/Cargo.toml
            spikes/f0-pipeline/Cargo.toml
          )
          # The virtual-audio harness lands in its own change; check it when present.
          if [ -f spikes/f0-virtual-audio/Cargo.toml ]; then
            manifests+=(spikes/f0-virtual-audio/Cargo.toml)
          fi
          status=0
          for manifest in "${manifests[@]}"; do
            echo "::group::cargo fmt --manifest-path $manifest --all -- --check"
            if ! cargo fmt --manifest-path "$manifest" --all -- --check; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Test and lint the pairing harness
        working-directory: .
        run: |
          cargo clippy --manifest-path spikes/f0-handshake/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path spikes/f0-handshake/Cargo.toml

      - name: Test and lint the pipeline harness
        working-directory: .
        run: |
          cargo clippy --manifest-path spikes/f0-pipeline/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path spikes/f0-pipeline/Cargo.toml

      - name: Test and lint the virtual audio harness
        working-directory: .
        run: |
          cargo fmt --manifest-path spikes/f0-virtual-audio/Cargo.toml -- --check
          cargo clippy --manifest-path spikes/f0-virtual-audio/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path spikes/f0-virtual-audio/Cargo.toml

      - name: Install coverage tooling
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure protocol coverage
        run: |
          cargo llvm-cov --package remotecam-protocol --summary-only | tee coverage.txt
          awk '/^TOTAL/ {print "Rust protocol coverage: " $NF}' coverage.txt >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python measurement tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install measurement package
        run: python -m pip install -e "spikes/tools[dev]"

      - name: Lint
        run: |
          python -m ruff check spikes/tools spikes/f0-camera-injection spikes/f0-handshake spikes/f0-virtual-audio
          python -m ruff format --check spikes/tools spikes/f0-camera-injection spikes/f0-handshake spikes/f0-virtual-audio

      - name: Run tests
        run: python -m pytest spikes/tools spikes/f0-camera-injection spikes/f0-handshake spikes/f0-virtual-audio

      - name: Record the preflight environment
        run: python spikes/tools/preflight.py --no-network-probe

      - name: Run the toolchain self-test
        run: python spikes/tools/selftest.py

      - name: Validate the recorded evidence
        run: python spikes/tools/validation/validate_evidence.py --evidence-root spikes/evidence

  android:
    name: Android contract module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and JaCoCo report
        run: gradle -p mobile :protocol:testDebugUnitTest :protocol:jacocoTestReport :core:testDebugUnitTest --no-daemon

      - name: Publish coverage
        run: python3 scripts/ci/coverage_summary.py mobile/protocol/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Rust toolchain for conformance
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Run protocol conformance on both stacks
        run: bash protocol/vectors/run_conformance.sh
